<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Tic Tac Toe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="TicTacToe.css">
</head>
<body>

<!-- shared SVG filter definitions, referenced by all inline SVGs on the page -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="chalkRough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise" seed="7"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div class="app" id="app">
  <header>
    <h1>Tic Tac Toe</h1>
    <div class="subtitle">chalkboard edition</div>
  </header>

  <div class="segmented" role="tablist" aria-label="Game mode">
    <button id="modeFriend" class="active" role="tab" aria-selected="true">Two Players</button>
    <button id="modeCPU" role="tab" aria-selected="false">Vs Computer</button>
  </div>

  <div class="diff-row" id="diffRow">
    <button data-diff="easy">Easy</button>
    <button data-diff="medium" class="active">Medium</button>
    <button data-diff="hard">Hard</button>
  </div>

  <div class="name-row" id="nameRow">
    <div class="name-field x">
      <label for="nameX">Player X</label>
      <input id="nameX" maxlength="12" spellcheck="false" placeholder="Player X"/>
    </div>
    <div class="name-field o">
      <label for="nameO" id="nameOLabel">Player O</label>
      <input id="nameO" maxlength="12" spellcheck="false" placeholder="Player O"/>
    </div>
  </div>

  <div class="status" id="status" aria-live="polite">
    <span>Turn: </span><span class="mark-x">X</span>
  </div>

  <div class="board-frame">
    <div class="board" id="board">
      <svg class="overlay" id="gridOverlay" viewBox="0 0 300 300"></svg>
      <!-- 9 cells + ambient dust injected by JS -->
    </div>
  </div>

  <div class="score-tray">
    <div class="score-card x">
      <div class="label" id="scoreLabelX">X</div>
      <div class="num" id="scoreX">0</div>
    </div>
    <div class="score-card d">
      <div class="label">Draws</div>
      <div class="num" id="scoreD">0</div>
    </div>
    <div class="score-card o">
      <div class="label" id="scoreLabelO">O</div>
      <div class="num" id="scoreO">0</div>
    </div>
  </div>

  <div class="actions">
    <button class="primary" id="newRoundBtn">New Round</button>
    <button id="resetBtn">Reset Match</button>
    <button class="icon-btn" id="muteBtn" aria-label="Toggle sound" title="Toggle sound">🔊</button>
  </div>
</div>

<div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>

<script src="TicTacToe.js"></script>
</body>
</html>
